<!DOCTYPE html>
<html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SL Fast Market</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--b:#0a5bd8;--o:#ff7a00;--bg:#f3f6fc;--c:#fff;--t:#14213d;--m:#5a6685;--l:#dbe3f3}
@media(prefers-color-scheme:dark){:root{--bg:#0d1424;--c:#16203a;--t:#eaf0ff;--m:#9aa8cc;--l:#2a3658}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Sinhala",sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
header{background:var(--b);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header input{flex:1;min-width:140px;padding:9px 12px;border-radius:20px;border:0}
nav a,button{cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:var(--b);color:#fff;font:inherit;text-decoration:none;display:inline-block}
nav a{background:rgba(255,255,255,.18);margin:2px;font-size:.9rem}button.o{background:var(--o)}button.g{background:var(--m)}button.r{background:#c62828}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.grid .card{margin:0;cursor:pointer}.grid img{width:100%;height:140px;object-fit:cover;border-radius:8px}
input,select,textarea{width:100%;padding:9px;margin:4px 0 10px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
label{font-size:.85rem;color:var(--m)}.req:after{content:" *";color:#c62828}
.st{color:#f5a623}.st i{color:var(--l);font-style:normal}.price{color:var(--o);font-weight:700}
.best{background:linear-gradient(120deg,var(--b),#2f86ff);color:#fff;border:0;display:flex;gap:14px;align-items:center;cursor:pointer}
.badge,.tag{background:var(--o);color:#fff;padding:2px 10px;border-radius:12px;font-size:.8rem}
.logo{width:60px;height:60px;border-radius:50%;object-fit:cover;background:var(--l)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.soc a{font-size:1.6rem;margin-right:10px;color:var(--b)}.rate button{background:none;color:#f5a623;font-size:1.5rem;padding:0 3px}
#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
</style></head><body>
<header><b onclick="location.hash=''" style="cursor:pointer">SL <span style="color:#ffb15c">Fast</span> Market</b>
<input id="q" placeholder="වෙළඳ භාණ්ඩ සොයන්න…" onkeydown="if(event.key=='Enter')location.hash='#s/'+encodeURIComponent(this.value)"><nav id="nav"></nav></header>
<main id="app"></main><div id="msg"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
let D=JSON.parse(localStorage.getItem('slf')||'{"u":[],"p":[],"o":[]}');
const save=()=>{try{localStorage.setItem('slf',JSON.stringify(D))}catch(e){say('ගබඩා ඉඩ අවසන්! පින්තූර අඩු කරන්න')}};
let me=D.u.find(x=>x.id==localStorage.getItem('slfme'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3000)};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const cnt=o=>Object.keys(o.ratings||{}).length,avg=o=>cnt(o)?Object.values(o.ratings).reduce((a,b)=>a+b,0)/cnt(o):0;
const byRate=(a,b)=>avg(b)-avg(a)||cnt(b)-cnt(a);
const stars=o=>{const v=Math.round(avg(o));return `<span class="st">${'★'.repeat(v)}<i>${'★'.repeat(5-v)}</i></span> <small>${avg(o).toFixed(1)} (${cnt(o)})</small>`};
const SOC={youtube:'fa-youtube',facebook:'fa-facebook',tiktok:'fa-tiktok',instagram:'fa-instagram',whatsapp:'fa-whatsapp'};
const soc=l=>(l||[]).map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener noreferrer"><i class="fa-brands ${SOC[x.p]}"></i></a>`).join('');
const okUrl=u=>/^https:\/\//i.test(u);
const imgUrl=(f,m)=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=URL.createObjectURL(f)});
const rb=()=>`<span class="rate">${[1,2,3,4,5].map(n=>`<button data-r="${n}">☆</button>`).join('')}</span>`;
const bindR=f=>document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!me)return say('තරු දීමට ඇතුල් වන්න');f(+b.dataset.r);save();say('තරු සටහන් විය');route()});
const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
const nav=()=>{$('#nav').innerHTML=me?`<a href="#">මුල් පිටුව</a>${me.role=='biz'?'<a href="#add">+ භාණ්ඩයක්</a><a href="#orders">ඇණවුම්</a><a href="#profile">ප්‍රොෆයිල්</a>':'<a href="#saved">සේව් කළ</a><a href="#orders">මගේ ඇණවුම්</a>'}<a href="#" id="out">ඉවත් වන්න</a>`:'<a href="#login">ඇතුල් වන්න</a><a href="#reg">ගිණුමක් හදන්න</a>'};
document.addEventListener('click',e=>{if(e.target.id=='out'){e.preventDefault();localStorage.removeItem('slfme');me=null;nav();location.hash='';route()}});
addEventListener('hashchange',route);
function route(){nav();const [p,a]=(location.hash.slice(1)||'home').split('/');const V={home,s:search,login,reg,biz:bizPage,b:bizPage,p:prod,add,orders,saved,profile};try{(V[p]||home)(decodeURIComponent(a||''))}catch(e){A.innerHTML='<div class="card">දෝෂයක්: '+esc(e.message)+'</div>'}}
const card=p=>`<div class="card" onclick="location.hash='#p/${p.id}'"><img src="${p.img}" alt=""><b>${esc(p.name)}</b><br><span class="price">රු. ${esc(p.price)}</span> ${p.avail===false?'<span class="tag">නැත</span>':''}<br>${stars(p)}<br><small>${esc(D.u.find(u=>u.id==p.owner)?.name)}</small></div>`;
const bizList=()=>D.u.filter(u=>u.role=='biz').sort(byRate);
function home(){
 const bz=bizList(),pr=[...D.p].sort(byRate),t=bz[0];
 A.innerHTML=(t&&cnt(t)?`<div class="card best" onclick="location.hash='#b/${t.id}'"><img class="logo" src="${t.logo||''}" alt=""><div><span class="badge">🏆 හොඳම ආයතනය</span><h2 style="margin:4px 0">${esc(t.name)}</h2>${stars(t)}</div></div>`:'')
 +'<h2>ශ්‍රේණිගත ආයතන</h2>'+(bz.slice(0,10).map((b,i)=>`<div class="card row" onclick="location.hash='#biz/${b.id}'" style="cursor:pointer;${i?'':'border:2px solid var(--o)'}"><b>#${i+1}</b><img class="logo" src="${b.logo||''}" alt=""><div><b>${esc(b.name)}</b><br>${stars(b)}<br><small>📍 ${esc(b.location)}</small></div></div>`).join('')||'<p>ආයතන නැත.</p>')
 +`<h2>භාණ්ඩ</h2><div class="grid">${pr.map(card).join('')||'<p>භාණ්ඩ නැත.</p>'}</div>`;
}
function search(t){$('#q').value=t;const r=D.p.filter(p=>p.name.toLowerCase().includes(t.toLowerCase())).sort(byRate);A.innerHTML=`<h2>“${esc(t)}” (තරු වැඩි පළමුව)</h2><div class="grid">${r.map(card).join('')||'<p>හමු නොවීය.</p>'}</div>`}
function login(){
 A.innerHTML='<div class="card"><h2>ඇතුල් වන්න</h2><label>Username</label><input id="u"><label>මුරපදය</label><input id="pw" type="password"><button id="go">ඇතුල් වන්න</button></div>';
 $('#go').onclick=async()=>{const u=D.u.find(x=>x.username==$('#u').value.trim().toLowerCase());if(!u||u.pw!=await hash(u.salt+$('#pw').value))return say('Username හෝ මුරපදය වැරදියි');me=u;localStorage.setItem('slfme',u.id);location.hash=''}
}
function reg(){
 A.innerHTML=`<div class="card"><h2>ගිණුමක් හදන්න</h2><label>වර්ගය</label><select id="role"><option value="cust">පාරිභෝගික</option><option value="biz">ව්‍යාපාරික</option></select>
 <label class="req">Username (අනන්‍ය)</label><input id="un"><label class="req">Email</label><input id="em" type="email"><label class="req">මුරපදය (අකුරු 8+)</label><input id="pw" type="password">
 <label class="req">දුරකථන</label><input id="ph" type="tel"><label class="req">නම / වෙළඳ නාමය</label><input id="nm">
 <div id="bz" style="display:none"><label class="req">ස්ථානය</label><input id="loc"><button class="g" id="gps">📍 GPS</button><label>ලිපිනය</label><input id="ad"><label>ලාංඡනය</label><input id="lg" type="file" accept="image/*">
 ${Object.keys(SOC).map(k=>`<label>${k} (https://…)</label><input data-s="${k}">`).join('')}</div><button class="o" id="go">ගිණුම හදන්න</button></div>`;
 $('#role').onchange=e=>$('#bz').style.display=e.target.value=='biz'?'block':'none';
 on('#gps',()=>navigator.geolocation.getCurrentPosition(p=>$('#loc').value=p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5),()=>say('GPS අවසර නැත')));
 $('#go').onclick=async()=>{const un=$('#un').value.trim().toLowerCase(),role=$('#role').value,pw=$('#pw').value;
  if(!/^[a-z0-9_]{3,24}$/.test(un))return say('Username: a-z 0-9 _ (3-24)');
  if(D.u.some(x=>x.username==un))return say('මෙම Username එක දැනටමත් භාවිතා වේ');
  const u={id:id(),role,username:un,email:$('#em').value.trim(),phone:$('#ph').value.trim(),name:$('#nm').value.trim(),ratings:{},saved:{},salt:id()};
  if(!u.email||!u.phone||!u.name||pw.length<8)return say('අනිවාර්ය තොරතුරු සම්පූර්ණ කරන්න');
  if(role=='biz'){u.location=$('#loc').value.trim();if(!u.location)return say('ස්ථානය අනිවාර්යයි');u.address=$('#ad').value.trim();const f=$('#lg').files[0];u.logo=f?await imgUrl(f,160):'';u.links=[...document.querySelectorAll('[data-s]')].filter(i=>okUrl(i.value.trim())).map(i=>({p:i.dataset.s,u:i.value.trim()}))}
  u.pw=await hash(u.salt+pw);D.u.push(u);save();me=u;localStorage.setItem('slfme',u.id);say('ගිණුම සාදා අවසන්');location.hash=''}
}
function bizPage(i){const b=D.u.find(u=>u.id==i);const pr=D.p.filter(p=>p.owner==i).sort(byRate);
 A.innerHTML=`<div class="card"><div class="row"><img class="logo" src="${b.logo||''}" alt=""><div><h2 style="margin:0">${esc(b.name)}</h2>${stars(b)}</div></div><p>📍 ${esc(b.location)} ${esc(b.address)}<br>📞 <a href="tel:${esc(b.phone)}">${esc(b.phone)}</a><br>✉️ <a href="mailto:${esc(b.email)}?subject=SL Fast Market">${esc(b.email)} – පණිවිඩයක් යවන්න</a></p><div class="soc">${soc(b.links)}</div>${me&&me.role=='cust'?'<p>ආයතනයට තරු දෙන්න:</p>'+rb():''}</div><div class="grid">${pr.map(card).join('')}</div>`;
 bindR(v=>b.ratings[me.id]=v)}
function prod(i){const p=D.p.find(x=>x.id==i);if(!p)return A.innerHTML='<div class="card">භාණ්ඩය ඉවත් කර ඇත</div>';const o=D.u.find(u=>u.id==p.owner),mine=me&&me.id==p.owner;
 A.innerHTML=`<div class="card"><img src="${p.img}" style="max-width:100%;max-height:360px;border-radius:10px" alt=""><h2>${esc(p.name)}</h2><p class="price">රු. ${esc(p.price)} ${p.avail===false?'<span class="tag">තොග නැත</span>':''}</p>${stars(p)}<p>${esc(p.desc)}</p><p>ආයතනය: <a href="#b/${o.id}">${esc(o.name)}</a></p>
 ${me&&me.role=='cust'?`${rb()}<div class="row"><input id="qty" type="number" min="1" value="1" style="width:80px"><button class="o" id="ord">ඇණවුම් කරන්න</button><button class="g" id="sv">♡ සේව්</button></div>`:''}
 ${mine?`<hr><input id="np" value="${esc(p.price)}"><div class="row"><button id="up">මිල වෙනස් කරන්න</button><button class="g" id="av">තොග තත්ත්වය මාරු</button><button class="r" id="del">ඉවත් කරන්න</button></div>`:''}</div>
 <div class="card"><h2>අදහස් (${p.comments.length})</h2>${me?'<textarea id="ct" maxlength="500"></textarea><button id="cb">පළ කරන්න</button>':'<p>අදහස් දැක්වීමට ඇතුල් වන්න.</p>'}${[...p.comments].reverse().map(c=>`<p><b>${esc(c.n)}</b>: ${esc(c.t)}</p>`).join('')}</div>`;
 bindR(v=>p.ratings[me.id]=v);
 on('#cb',()=>{const t=$('#ct').value.trim();if(t){p.comments.push({n:me.name,t});save();route()}});
 on('#sv',()=>{me.saved[p.id]=p.price;save();say('සේව් විය')});
 on('#ord',()=>{D.o.push({id:id(),pid:p.id,pname:p.name,price:p.price,seller:p.owner,buyer:me.id,bn:me.name,ph:me.phone,qty:+$('#qty').value||1,st:'p'});save();location.hash='#orders'});
 on('#up',()=>{p.price=$('#np').value.trim();save();say('මිල යාවත්කාලීන විය');route()});
 on('#av',()=>{p.avail=p.avail===false;save();route()});
 on('#del',()=>{if(confirm('ඉවත් කරන්නද?')){D.p=D.p.filter(x=>x.id!=p.id);save();location.hash=''}});}
function add(){if(!me||me.role!='biz')return A.innerHTML='<div class="card">ව්‍යාපාරික ගිණුමක් අවශ්‍යයි</div>';
 A.innerHTML='<div class="card"><h2>නව භාණ්ඩයක්</h2><label class="req">නම</label><input id="n"><label class="req">මිල</label><input id="pr" type="number" min="0"><label class="req">ඡායාරූපය</label><input id="im" type="file" accept="image/*"><label>විස්තරය</label><textarea id="d"></textarea><button class="o" id="go">පළ කරන්න</button></div>';
 $('#go').onclick=async()=>{const f=$('#im').files[0],n=$('#n').value.trim(),pr=$('#pr').value;if(!n||!pr||!f)return say('නම, මිල, ඡායාරූපය අනිවාර්යයි');
  D.p.push({id:id(),owner:me.id,name:n,price:pr,img:await imgUrl(f,450),desc:$('#d').value.trim(),avail:true,ratings:{},comments:[]});save();say('පළ විය');location.hash=''}}
function orders(){if(!me)return location.hash='#login';const k=me.role=='biz'?'seller':'buyer',os=D.o.filter(o=>o[k]==me.id);
 A.innerHTML='<h2>ඇණවුම්</h2>'+(os.map(o=>`<div class="card"><b>${esc(o.pname)}</b> × ${o.qty} – රු. ${esc(o.price)}<br>${me.role=='biz'?esc(o.bn)+' 📞 '+esc(o.ph)+'<br>':''}<span class="tag">${o.st=='d'?'ලබා දුන්':'පොරොත්තුවේ'}</span><div class="row">${me.role=='biz'&&o.st!='d'?`<button data-d="${o.id}">ලබාදුන් ලෙස</button>`:''}<button class="r" data-x="${o.id}">ඉවත් කරන්න</button></div></div>`).join('')||'<p>ඇණවුම් නැත.</p>');
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{D.o.find(o=>o.id==b.dataset.d).st='d';save();route()});
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{D.o=D.o.filter(o=>o.id!=b.dataset.x);save();route()})}
function saved(){if(!me)return location.hash='#login';
 A.innerHTML='<h2>සේව් කළ භාණ්ඩ</h2>'+(Object.entries(me.saved).map(([i,was])=>{const p=D.p.find(x=>x.id==i);return p?`<div class="card row"><img class="logo" src="${p.img}" alt=""><div><a href="#p/${i}"><b>${esc(p.name)}</b></a><br><span class="price">රු. ${esc(p.price)}</span> ${String(was)!=String(p.price)?`<span class="tag">මිල වෙනස්: රු. ${esc(was)} → රු. ${esc(p.price)}</span>`:''}</div><button class="r" data-x="${i}">ඉවත්</button></div>`:`<div class="card">භාණ්ඩය ඉවත් කර ඇත <button class="r" data-x="${i}">මකන්න</button></div>`}).join('')||'<p>කිසිවක් නැත.</p>');
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{delete me.saved[b.dataset.x];save();route()})}
