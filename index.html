<!DOCTYPE html>
<html lang="si"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SL Fast Market</title>
<meta name="theme-color" content="#0b5bd3">
<style>
:root{--b:#0b5bd3;--o:#ff7a00;--bg:#f3f6fb;--c:#fff;--t:#14213d;--m:#667085;--l:#e3e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1424;--c:#17213a;--t:#eef2fb;--m:#9aa6c0;--l:#2a3656}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Sinhala",Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--b);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px}
header img{width:40px;height:40px;border-radius:50%;background:#fff}
header h1{font-size:18px;margin:0;flex:1}header h1 span{color:#ffb066}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-size:14px;position:relative}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:11px;margin:4px 0 10px;border:1px solid var(--l);border-radius:10px;background:var(--bg);color:var(--t);font:inherit}
label{font-size:13px;color:var(--m)}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.o{background:var(--o)}.btn.g{background:transparent;color:var(--b);border:1px solid var(--b)}.btn.s{padding:7px 11px;font-size:13px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row .fit{flex:none}
.biz{display:flex;gap:12px;align-items:center;cursor:pointer}
.av{width:56px;height:56px;border-radius:12px;background:var(--bg);object-fit:cover;border:1px solid var(--l);flex:none;display:grid;place-items:center;font-weight:700;color:var(--b);font-size:22px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:none;border:1px solid var(--l);background:var(--c);color:var(--t);padding:8px 14px;border-radius:20px;font:inherit}
.tabs .on{background:var(--b);color:#fff;border-color:var(--b)}
.soc{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.soc a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#fff;padding:6px 12px 6px 6px;border-radius:20px;font-size:13px}
.soc i{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:12px;background:var(--bg);color:var(--m)}
.st-new{background:#fff1e0;color:#b45300}.st-acc{background:#e0ecff;color:#0b5bd3}.st-del{background:#dff7e5;color:#157f3a}.st-can{background:#fde4e4;color:#b42318}
.badge{background:var(--o);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:4px}
.price{color:var(--o);font-weight:700}.m{color:var(--m);font-size:13px}.err{color:#d92d20;font-size:13px;min-height:18px}
.hero{text-align:center;padding:10px 0 4px}.hero img{width:110px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14213d;color:#fff;padding:11px 18px;border-radius:24px;z-index:20;max-width:90%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.grid .card{margin:0}
.pimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--bg)}
</style></head><body>

function img(file,max=480){return new Promise(r=>{if(!file)return r("");const f=new FileReader();f.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.8))};i.src=f.result};f.readAsDataURL(file)})}

 $("#hb").innerHTML=me?`පැනල් ${myNew()?`<span class=badge>${myNew()}</span>`:""}`:"ඇතුල් වන්න";
 $("#hb").onclick=()=>go(me?"dash":"login");
 ({home,biz,login,reg,dash})[view]();
}
function home(){
 const list=users.filter(u=>!q||(u.name+u.cat+u.addr).toLowerCase().includes(q.toLowerCase()));
 $("#app").innerHTML=`<div class=hero><img src="${LOGO}"><p class=m>ඔබේ ප්‍රදේශයේ වෙළඳසැල් සොයන්න — වේගයෙන් ඇණවුම් කරන්න</p></div>
 <input id=sq placeholder="🔍 ව්‍යාපාරය හෝ වර්ගය සොයන්න" value="${esc(q)}">
 ${list.map(u=>`<div class="card biz" onclick="go('biz','${u.id}')">${u.logo?`<img class=av src="${u.logo}">`:`<div class=av>${esc(u.name[0])}</div>`}<div style="flex:1"><b>${esc(u.name)}</b><div class=m>${esc(u.cat||"")} ${u.addr?"· "+esc(u.addr):""}</div></div><span class=tag>${u.products.length} භාණ්ඩ</span></div>`).join("")||`<div class="card m" style="text-align:center">තවම ව්‍යාපාර නැත. <br><br><button class="btn o" onclick="go('reg')">ඔබේ ව්‍යාපාරය ලියාපදිංචි කරන්න</button></div>`}`;
 const s=$("#sq");s.oninput=()=>{q=s.value;home();const e=$("#sq");e.focus();e.setSelectionRange(q.length,q.length)};
}
function biz(){
 const u=users.find(x=>x.id===cur);if(!u)return go("home");
 $("#app").innerHTML=`<button class="btn g s" onclick="go('home')">← ආපසු</button><div class=card style="margin-top:10px"><div class=biz style="cursor:default">${u.logo?`<img class=av src="${u.logo}">`:`<div class=av>${esc(u.name[0])}</div>`}<div><h2 style="margin:0">${esc(u.name)}</h2><span class=tag>${esc(u.cat||"")}</span></div></div>
 <p>${esc(u.desc||"")}</p>${u.addr?`<div>📍 ${esc(u.addr)}</div>`:""}
 ${u.phones.map(p=>`<div>📞 <a href="tel:${esc(p)}">${esc(p)}</a></div>`).join("")}
 ${u.email?`<div>✉️ <a href="mailto:${esc(u.email)}?subject=${encodeURIComponent("SL Fast Market විමසීම")}">${esc(u.email)}</a></div>`:""}
 <div class=soc>${u.links.map(l=>{const s=soc(l);return`<a href="${esc(fixUrl(l))}" target=_blank rel=noopener style="background:${s[0]}"><i>${s[1]}</i>${s[2]}</a>`}).join("")}</div>
 ${u.email?`<a class="btn o" style="display:inline-block;text-decoration:none" href="mailto:${esc(u.email)}">✉️ Gmail පණිවිඩයක් යවන්න</a>`:""}</div>
 <h3>භාණ්ඩ</h3><div class=grid>${u.products.map((p,i)=>`<div class=card>${p.img?`<img class=pimg src="${p.img}">`:""}<b>${esc(p.name)}</b><div class=price>රු. ${esc(p.price)}</div><button class="btn s" style="margin-top:8px;width:100%" onclick="order('${u.id}',${i})">ඇණවුම් කරන්න</button></div>`).join("")||"<p class=m>භාණ්ඩ නැත</p>"}</div>`;
}
function order(bid,i){
 const u=users.find(x=>x.id===bid),p=u.products[i],d=new Date(Date.now()+864e5).toISOString().slice(0,10);
 const w=document.createElement("div");w.style="position:fixed;inset:0;background:#0008;z-index:15;display:grid;align-items:end";
 w.innerHTML=`<div class=card style="margin:0;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto"><h3>${esc(p.name)} — රු. ${esc(p.price)}</h3>
 <label>ඔබේ නම</label><input id=on><label>දුරකථන</label><input id=op type=tel><label>ප්‍රමාණය</label><input id=oq type=number min=1 value=1>
 <label>අවශ්‍ය දිනය</label><input id=od type=date value="${d}"><label>වේලාව</label><input id=ot type=time value="10:00"><label>ලිපිනය / සටහන</label><textarea id=oa rows=2></textarea>
 <div class=err id=oe></div><div class=row><button class="btn g" id=oc>අවලංගු</button><button class="btn o" id=os>ඇණවුම යවන්න</button></div></div>`;
 document.body.appendChild(w);$("#oc").onclick=()=>w.remove();
 $("#os").onclick=()=>{const n=$("#on").value.trim(),ph=$("#op").value.trim();if(!n||!ph)return $("#oe").textContent="නම සහ දුරකථනය අවශ්‍යයි";
  orders.push({id:"o"+Date.now(),bid,pname:p.name,price:p.price,qty:+$("#oq").value||1,cname:n,cphone:ph,note:$("#oa").value,when:$("#od").value+" "+$("#ot").value,placed:Date.now(),status:"new"});
  save();w.remove();toast("✅ ඇණවුම යවන ලදී! ව්‍යාපාරයට දැනුම් දෙනු ලැබේ");};
}
function login(){
 $("#app").innerHTML=`<div class=hero><img src="${LOGO}"></div><div class=card><h3>ඇතුල් වන්න</h3><label>Username</label><input id=lu autocapitalize=none><label>Password</label><input id=lp type=password><div class=err id=le></div>
 <button class="btn" style="width:100%" id=lb>Login</button><p class=m style="text-align:center">ගිණුමක් නැද්ද? <a href=# onclick="go('reg');return false">ලියාපදිංචි වන්න</a></p></div>`;
 $("#lb").onclick=async()=>{const u=users.find(x=>x.username===norm($("#lu").value));if(!u||u.pw!==await hash($("#lp").value))return $("#le").textContent="Username හෝ Password වැරදියි";me=u.id;DB.set("session",me);go("dash")};
}
function reg(){
 $("#app").innerHTML=`<div class=card><h3>ව්‍යාපාරික ගිණුමක් සාදන්න</h3>
 <label>ව්‍යාපාරයේ නම *</label><input id=rn><label>ව්‍යාපාර වර්ගය</label><input id=rc placeholder="උදා: සුපර්මාර්කට්, ඖෂධ, ආහාර">
 <label>Username * (අද්විතීය)</label><input id=ru autocapitalize=none><label>Password * (අකුරු 6+)</label><input id=rp type=password>
 <label>දුරකථන අංක (කොමාවෙන් වෙන් කරන්න) *</label><input id=rt placeholder="0771234567, 0112345678">
 <label>Gmail</label><input id=re type=email><label>ලිපිනය</label><input id=ra><label>විස්තරය</label><textarea id=rd rows=2></textarea>
 <label>වෙබ් අඩවිය / Social ලින්ක් (එක පේළියකට එකක්)</label><textarea id=rl rows=3 placeholder="https://facebook.com/...&#10;https://wa.me/94771234567&#10;https://youtube.com/..."></textarea>
 <label>ලෝගෝව</label><input id=rf type=file accept="image/*"><div class=err id=re2></div>
 <button class="btn o" style="width:100%" id=rb>ගිණුම සාදන්න</button></div>`;
 $("#rb").onclick=async()=>{const e=$("#re2"),name=$("#rn").value.trim(),un=norm($("#ru").value),pw=$("#rp").value,ph=$("#rt").value.split(",").map(s=>s.trim()).filter(Boolean);
  if(!name||!un||!ph.length)return e.textContent="* ක්ෂේත්‍ර පුරවන්න";if(pw.length<6)return e.textContent="Password අකුරු 6ක් හෝ වැඩි විය යුතුයි";
  if(users.some(u=>u.username===un))return e.textContent="මෙම Username දැනටමත් භාවිතයේ ඇත";
  if(users.some(u=>norm(u.name)===norm(name)))return e.textContent="මෙම ව්‍යාපාර නමින් ගිණුමක් දැනටමත් ඇත";
  const u={id:"u"+Date.now(),username:un,pw:await hash(pw),name,cat:$("#rc").value.trim(),email:$("#re").value.trim(),addr:$("#ra").value.trim(),desc:$("#rd").value.trim(),phones:ph,links:$("#rl").value.split("\n").map(s=>s.trim()).filter(Boolean),logo:await img($("#rf").files[0],200),products:[]};
  users.push(u);save();me=u.id;DB.set("session",me);toast("ගිණුම සාදන ලදී 🎉");go("dash")};
}
function dash(){
 const u=me_u();if(!u){me=null;return go("login")}
 const T=[["orders","ඇණවුම්"],["products","භාණ්ඩ"],["profile","පැතිකඩ"]];
 let h=`<div class=tabs>${T.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="tab='${t[0]}';dash()">${t[1]}${t[0]==="orders"&&myNew()?`<span class=badge>${myNew()}</span>`:""}</button>`).join("")}<button onclick="go('biz','${u.id}')">👁 මගේ පිටුව</button><button onclick="me=null;DB.set('session',null);go('home')">Logout</button></div>`;
 if(tab==="orders"){const os=orders.filter(o=>o.bid===u.id).sort((a,b)=>b.placed-a.placed);
  const L={new:["අලුත්","st-new"],acc:["පිළිගත්","st-acc"],del:["භාර දුන්","st-del"],can:["අවලංගු","st-can"]};
  h+=os.map(o=>`<div class=card><div class=row><b>${esc(o.pname)} × ${o.qty}</b><span class="tag fit ${L[o.status][1]}">${L[o.status][0]}</span></div><div>රු. ${o.price*o.qty||o.price}</div>
  <div>👤 ${esc(o.cname)} · <a href="tel:${esc(o.cphone)}">${esc(o.cphone)}</a></div><div class=m>අවශ්‍ය දිනය/වේලාව: ${esc(o.when)}</div>${o.note?`<div class=m>📝 ${esc(o.note)}</div>`:""}<div class=m>ඇණවුම් කළ: ${fmt(o.placed)}${o.done?` · භාර දුන්: ${fmt(o.done)}`:""}</div>
  <div class=row style="margin-top:8px">${o.status==="new"?`<button class="btn s" onclick="st('${o.id}','acc')">පිළිගන්න</button><button class="btn g s" onclick="st('${o.id}','can')">අවලංගු</button>`:""}${o.status==="acc"?`<button class="btn o s" onclick="st('${o.id}','del')">භාර දුන්නා ✔</button>`:""}</div></div>`).join("")||`<p class=m>ඇණවුම් නැත</p>`}
 if(tab==="products"){h+=`<div class=card><h3>භාණ්ඩයක් එක් කරන්න</h3><label>නම</label><input id=pn><label>මිල (රු.)</label><input id=pp type=number><label>රූපය</label><input id=pf type=file accept="image/*"><button class="btn" id=pb>එක් කරන්න</button></div>`+u.products.map((p,i)=>`<div class="card row">${p.img?`<img class=av src="${p.img}" style="flex:none">`:""}<div><b>${esc(p.name)}</b><div class=price>රු. ${esc(p.price)}</div></div><button class="btn g s fit" onclick="delp(${i})">ඉවත් කරන්න</button></div>`).join("")}
 if(tab==="profile"){h+=`<div class=card><h3>පැතිකඩ සංස්කරණය</h3><label>දුරකථන (කොමාවෙන්)</label><input id=ft value="${esc(u.phones.join(", "))}"><label>Gmail</label><input id=fe value="${esc(u.email)}"><label>ලිපිනය</label><input id=fa value="${esc(u.addr)}"><label>විස්තරය</label><textarea id=fd rows=2>${esc(u.desc)}</textarea><label>Social ලින්ක්</label><textarea id=fl rows=3>${esc(u.links.join("\n"))}</textarea><label>ලෝගෝව වෙනස් කරන්න</label><input id=ff type=file accept="image/*"><button class="btn" id=fb>සුරකින්න</button></div>`}
 $("#app").innerHTML=h;
 if($("#pb"))$("#pb").onclick=async()=>{const n=$("#pn").value.trim();if(!n||!$("#pp").value)return toast("නම සහ මිල දෙන්න");u.products.push({name:n,price:$("#pp").value,img:await img($("#pf").files[0])});save();dash()};
 if($("#fb"))$("#fb").onclick=async()=>{u.phones=$("#ft").value.split(",").map(s=>s.trim()).filter(Boolean);u.email=$("#fe").value.trim();u.addr=$("#fa").value.trim();u.desc=$("#fd").value.trim();u.links=$("#fl").value.split("\n").map(s=>s.trim()).filter(Boolean);if($("#ff").files[0])u.logo=await img($("#ff").files[0],200);save();toast("සුරැකිණි ✔");dash()};
}
function st(id,s){const o=orders.find(x=>x.id===id);o.status=s;if(s==="del")o.done=Date.now();save();render()}
function delp(i){me_u().products.splice(i,1);save();dash()}
/* new-order alerts (works while app is open; use FCM push for background) */
let seen=orders.filter(o=>o.status==="new").length;
setInterval(()=>{users=DB.get("users",[]);const prev=orders.length;orders=DB.get("orders",[]);if(me&&orders.length>prev){toast("🔔 අලුත් ඇණවුමක්!");try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}if(view==="dash")dash();else render()}},3000);
render();
</script></body></html>
